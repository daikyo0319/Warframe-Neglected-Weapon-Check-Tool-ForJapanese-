function getToday() {
  const d = new Date();
  const pad = n => n.toString().padStart(2, "0");
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} `
       + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ================================
// 初期ロード
// ================================
function initList(key, defaults) {
  const saved = localStorage.getItem(key);
  if (!saved) {
    localStorage.setItem(key, JSON.stringify(defaults));
    return defaults;
  }
  try {
    return JSON.parse(saved);
  } catch {
    localStorage.setItem(key, JSON.stringify(defaults));
    return defaults;
  }
}

let kuvaWeapons   = initList("kuvaWeapons", defaultKuvaWeapons);
let sisterWeapons = initList("sisterWeapons", defaultSisterWeapons);
elementList       = initList("elementList", elementList);
frameElements     = initList("frameElements", frameElements);

let kuvaChecked   = JSON.parse(localStorage.getItem("kuvaChecked") || "[]");
let sisterChecked = JSON.parse(localStorage.getItem("sisterChecked") || "[]");

let currentTab = "kuva";
let sortMode = "custom";
let filterCategory = "all";

function save() {
  localStorage.setItem("kuvaWeapons", JSON.stringify(kuvaWeapons));
  localStorage.setItem("sisterWeapons", JSON.stringify(sisterWeapons));
  localStorage.setItem("elementList", JSON.stringify(elementList));
  localStorage.setItem("frameElements", JSON.stringify(frameElements));
  localStorage.setItem("kuvaChecked", JSON.stringify(kuvaChecked));
  localStorage.setItem("sisterChecked", JSON.stringify(sisterChecked));
}

// ================================
// 並び替え・フィルター処理（武器）
// ================================
function setSortMode(mode) {
  sortMode = mode;
  render();
}

function setFilter(cat) {
  filterCategory = cat;
  render();
}

function applyFilter(list) {
  if (filterCategory === "all") return list;
  return list.filter(w => w.category === filterCategory);
}

function sortList(list) {
  let arr = [...list];

  if (sortMode === "abc") {
    arr.sort((a,b)=>a.name.localeCompare(b.name));
  } else if (sortMode === "category") {
    const order = { primary:1, secondary:2, melee:3, archgun:4 };
    arr.sort((a,b)=>{
      const ca = order[a.category] || 99;
      const cb = order[b.category] || 99;
      if (ca !== cb) return ca - cb;
      return a.name.localeCompare(b.name);
    });
  }
  return arr;
}

// ================================
// チェック切り替え（チェック時に日時保存）
// ================================
function toggle(id, mode) {
  const arr = mode === "kuva" ? kuvaChecked : sisterChecked;
  const idx = arr.indexOf(id);

  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(id);

  if (mode === "kuva") {
    localStorage.setItem("lastKuvaDate", getToday());
  }
  if (mode === "sister") {
    localStorage.setItem("lastSisterDate", getToday());
  }

  save();
  render();
}

function clearChecks(mode) {
  if (mode === "kuva") kuvaChecked = [];
  else sisterChecked = [];
  save();
  render();
}

// ================================
// 武器追加・削除・並び替え
// ================================
function addWeapon(type) {
  const name = document.getElementById(type === "kuva" ? "kName" : "sName").value.trim();
  const cat  = document.getElementById(type === "kuva" ? "kCat" : "sCat").value;

  if (!name) return;

  const id = name.toLowerCase().replace(/\s+/g, "_");
  const obj = { id, name, category: cat };

  if (type === "kuva") kuvaWeapons.push(obj);
  else sisterWeapons.push(obj);

  save();
  renderManage();
}

function deleteWeapon(type, id) {
  if (type === "kuva") {
    kuvaWeapons = kuvaWeapons.filter(w => w.id !== id);
    kuvaChecked = kuvaChecked.filter(c => c !== id);
  } else {
    sisterWeapons = sisterWeapons.filter(w => w.id !== id);
    sisterChecked = sisterChecked.filter(c => c !== id);
  }
  save();
  renderManage();
}

function moveWeapon(type, index, direction) {
  const list = type === "kuva" ? kuvaWeapons : sisterWeapons;
  const newIndex = index + direction;

  if (newIndex < 0 || newIndex >= list.length) return;

  [list[index], list[newIndex]] = [list[newIndex], list[index]];
  save();
  renderManage();
}

// ================================
// カテゴリ表示
// ================================
function categoryLabel(cat) {
  switch(cat) {
    case "primary": return "プライマリ";
    case "secondary": return "セカンダリ";
    case "melee": return "近接";
    case "archgun": return "AW銃";
    default: return cat;
  }
}

function categoryClass(cat) {
  return "category-tag category-" + cat;
}

// ================================
// 武器一覧描画
// ================================
function renderWeapons(list, mode) {
  const checkedArr = mode === "kuva" ? kuvaChecked : sisterChecked;

  let filtered = applyFilter(list);
  let sorted = sortList(filtered);

  let html = "";
  sorted.forEach(w => {
    const checked = checkedArr.includes(w.id) ? "checked" : "";
    html += `
      <div class="weapon-item">
        <label>
          <input type="checkbox" ${checked}
            onclick="toggle('${w.id}', '${mode}')">
          ${w.name}
          <span class="${categoryClass(w.category)}">${categoryLabel(w.category)}</span>
        </label>
      </div>
    `;
  });
  return html;
}

// ================================
// クバ武器タブ
// ================================
function renderKuva() {
  const last = localStorage.getItem("lastKuvaDate") || "記録なし";

  document.getElementById("content").innerHTML = `
    <h2>クバ武器</h2>
    <div>最終操作日時：${last}</div>
    <button onclick="clearChecks('kuva')">チェック全解除</button>
    ${renderWeapons(kuvaWeapons, "kuva")}
  `;
}

// ================================
// シスター武器タブ
// ================================
function renderSister() {
  const last = localStorage.getItem("lastSisterDate") || "記録なし";

  document.getElementById("content").innerHTML = `
    <h2>Tenet武器</h2>
    <div>最終操作日時：${last}</div>
    <button onclick="clearChecks('sister')">チェック全解除</button>
    ${renderWeapons(sisterWeapons, "sister")}
  `;
}

// ================================
// 属性表用グループ化
// ================================
function groupByElement() {
  const map = {};
  frameElements.forEach(row => {
    if (!map[row.element]) map[row.element] = [];
    map[row.element].push(row.frame);
  });
  return map;
}

// ================================
// 属性表タブ（表示＋フィルター＋管理＋フレーム管理）
// ================================
let editingFrameIndex = null;
let elementFilter = "all";

function renderElementTable() {
  const grouped = groupByElement();

  let html = `
    <h2>属性表（表示）</h2>

    属性フィルター：
    <select id="elementFilterSelect" onchange="onChangeElementFilter()">
      <option value="all" ${elementFilter === "all" ? "selected" : ""}>全部</option>
      ${elementList.map(e => `
        <option value="${e}" ${elementFilter === e ? "selected" : ""}>${e}</option>
      `).join("")}
    </select>

    <button onclick="sortElementFramesABC()">フレームABC順</button>

    <table>
      <tr><th>属性</th><th>フレーム一覧</th></tr>
  `;

  Object.keys(grouped).sort().forEach(element => {
    if (!element) return;
    if (elementFilter !== "all" && elementFilter !== element) return;

    const frames = [...grouped[element]].sort((a,b)=>a.localeCompare(b));
    html += `
      <tr>
        <td>${element}</td>
        <td>${frames.join(", ")}</td>
      </tr>
    `;
  });

  html += `</table><hr>`;

  // 属性管理
  html += `
    <h3>属性管理</h3>
    <input id="newElementName" placeholder="新しい属性名">
    <button onclick="addElement()">追加</button>

    <table>
      <tr><th>属性名</th><th>操作</th></tr>
  `;

  elementList.forEach(e => {
    html += `
      <tr>
        <td>${e}</td>
        <td><button onclick="deleteElement('${e}')">削除</button></td>
      </tr>
    `;
  });

  html += `</table><hr>`;

  // フレーム管理
  html += `
    <h3>フレーム管理</h3>

    並び替え：
    <button onclick="sortFrameElements('element')">属性順</button>
    <button onclick="sortFrameElements('abc')">ABC順</button>
    <button onclick="sortFrameElements('original')">追加順</button>

    <h4>フレーム追加</h4>
    <input id="newFrameName" placeholder="フレーム名">
    <select id="newFrameElement">
      <option value="">（属性なし）</option>
      ${elementList.map(e => `<option value="${e}">${e}</option>`).join("")}
    </select>
    <input id="newFrameNote" placeholder="備考（任意）">
    <button onclick="addFrame()">追加</button>

    <table>
      <tr><th>フレーム</th><th>属性</th><th>備考</th><th>操作</th></tr>
  `;

  frameElements.forEach((row, i) => {
    if (editingFrameIndex === i) {
      html += `
        <tr>
          <td><input id="editFrameName" value="${row.frame}"></td>
          <td>
            <select id="editFrameElement">
              <option value="">（属性なし）</option>
              ${elementList.map(e => `
                <option value="${e}" ${row.element === e ? "selected" : ""}>${e}</option>
              `).join("")}
            </select>
          </td>
          <td><input id="editFrameNote" value="${row.note}"></td>
          <td>
            <button onclick="saveFrameEdit(${i})">保存</button>
            <button onclick="cancelFrameEdit()">キャンセル</button>
          </td>
        </tr>
      `;
    } else {
      html += `
        <tr>
          <td>${row.frame}</td>
          <td>${row.element || "（なし）"}</td>
          <td>${row.note}</td>
          <td>
            <button onclick="startFrameEdit(${i})">編集</button>
            <button onclick="deleteFrame(${i})">削除</button>
          </td>
        </tr>
      `;
    }
  });

  html += `</table>`;

  document.getElementById("content").innerHTML = html;
}

function onChangeElementFilter() {
  const sel = document.getElementById("elementFilterSelect");
  elementFilter = sel.value;
  renderElementTable();
}

function sortElementFramesABC() {
  renderElementTable();
}

// 属性管理
function addElement() {
  const name = document.getElementById("newElementName").value.trim();
  if (!name) return;

  elementList.push(name);
  save();
  renderElementTable();
}

function deleteElement(name) {
  elementList = elementList.filter(e => e !== name);

  frameElements.forEach(row => {
    if (row.element === name) {
      row.element = "";
    }
  });

  save();
  renderElementTable();
}

// フレーム管理
function addFrame() {
  const frame = document.getElementById("newFrameName").value.trim();
  const element = document.getElementById("newFrameElement").value;
  const note = document.getElementById("newFrameNote").value.trim();

  if (!frame) return;

  frameElements.push({ frame, element, note });
  save();
  renderElementTable();
}

function startFrameEdit(index) {
  editingFrameIndex = index;
  renderElementTable();
}

function cancelFrameEdit() {
  editingFrameIndex = null;
  renderElementTable();
}

function saveFrameEdit(index) {
  const frame = document.getElementById("editFrameName").value.trim();
  const element = document.getElementById("editFrameElement").value;
  const note = document.getElementById("editFrameNote").value.trim();

  frameElements[index] = { frame, element, note };
  editingFrameIndex = null;
  save();
  renderElementTable();
}

function deleteFrame(index) {
  frameElements.splice(index, 1);
  save();
  renderElementTable();
}

function sortFrameElements(mode) {
  if (mode === "element") {
    frameElements.sort((a,b)=>a.element.localeCompare(b.element));
  } else if (mode === "abc") {
    frameElements.sort((a,b)=>a.frame.localeCompare(b.frame));
  }
  save();
  renderElementTable();
}

// ================================
// 管理画面（武器管理）
// ================================
function renderManage() {
  document.getElementById("content").innerHTML = `
    <h2>武器管理</h2>

// ================================
// タブ切り替え
// ================================
function setTab(tab) {
  currentTab = tab;

  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === tab);
  });

  render();
}

// ================================
// タブごとの描画
// ================================
function render() {
  if (currentTab === "kuva") renderKuva();
  if (currentTab === "sister") renderSister();
  if (currentTab === "manage") renderManage();
  if (currentTab === "element") renderElementTable();
}

// ================================
// タブクリックイベント
// ================================
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => setTab(t.dataset.tab));
});

// ================================
// 初期描画
// ================================
render();
</script>
